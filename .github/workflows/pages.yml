# Deploy the game to GitHub Pages. No build step: the site is the static files (index.html, style.css,
# src/, assets/). Enable it under Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html style.css src assets _site/
          # Pages serves _site as-is; skip Jekyll processing
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
